name: Feature request
description: Propose a focused improvement that fits ChronoDesk on one or more supported hosts.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        ChronoDesk favors coherent clock, timezone, accessibility, reliability, privacy, and platform-appropriate features over feature count. Desktop-only concepts should not be copied to mobile/browser unless the platform has a meaningful equivalent.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature and how it should behave on affected hosts.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Primary platform scope
      options:
        - Shared / all supported hosts
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPhone
        - iPadOS / iPad
        - Browser / WebAssembly
        - Desktop only (Windows / macOS / Linux)
        - Mobile / tablet only
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Clock display
        - World clocks / timezones
        - Shared mobile / browser UI
        - Focus / mini / tray behavior (desktop)
        - Appearance
        - Accessibility
        - Chimes / quiet hours
        - Import / export
        - Startup / desktop integration
        - Browser storage / hosting
        - Mobile lifecycle / packaging
        - Documentation / developer experience
        - Build / CI / release
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and roadmap items first.
          required: true
        - label: I considered whether this is shared behavior or a platform-specific capability.
          required: true
        - label: This request does not require sending private clock data to a remote service without an explicit privacy/security design.
          required: true
