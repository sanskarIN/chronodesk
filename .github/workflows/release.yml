name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Verify release version
        shell: pwsh
        run: ./scripts/check-version.ps1 -Tag "${{ github.ref_name }}"

      - name: Restore
        run: dotnet restore ChronoDesk.sln

      - name: Test
        run: dotnet test ChronoDesk.sln --configuration Release --no-restore

      - name: Publish self-contained app
        run: dotnet publish src/ChronoDesk.App/ChronoDesk.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output publish/${{ matrix.rid }}

      - name: Add release documentation
        shell: pwsh
        run: |
          $destination = "publish/${{ matrix.rid }}"
          Copy-Item LICENSE "$destination/LICENSE"
          Copy-Item README.md "$destination/README.md"
          Copy-Item CHANGELOG.md "$destination/CHANGELOG.md"
          Copy-Item PRIVACY.md "$destination/PRIVACY.md"
          Copy-Item SECURITY.md "$destination/SECURITY.md"
          Copy-Item SUPPORT.md "$destination/SUPPORT.md"

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/chronodesk-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: chronodesk-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: chronodesk-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts -Filter '*.zip' -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          if (-not $lines) {
            throw 'No release ZIP files were available for checksum generation.'
          }
          $lines | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.zip artifacts/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "ChronoDesk ${GITHUB_REF_NAME}"
