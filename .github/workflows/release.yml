name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pattern = '^v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?<suffix>-(?:[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
          if ($tag -notmatch $pattern) {
            throw "Release tag '$tag' is not a supported semantic version tag."
          }

          $version = "$($Matches.major).$($Matches.minor).$($Matches.patch)$($Matches.suffix)"
          $assemblyVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch).0"
          $isPrerelease = -not [string]::IsNullOrEmpty($Matches.suffix)
          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Validate local Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Scan committed text for credentials
        run: python3 scripts/check_repository_secrets.py

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore ChronoDesk.sln

      - name: Verify formatting
        run: dotnet format ChronoDesk.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ChronoDesk.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChronoDesk.sln --configuration Release --no-build

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $output = dotnet list ChronoDesk.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Vulnerable NuGet dependencies were reported."
            exit 1
          }

  package:
    name: Package ${{ matrix.rid }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ChronoDesk.sln

      - name: Test
        run: dotnet test ChronoDesk.sln --configuration Release --no-restore

      - name: Publish self-contained app
        run: >-
          dotnet publish src/ChronoDesk.App/ChronoDesk.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:Version=${{ needs.preflight.outputs.version }}
          -p:AssemblyVersion=${{ needs.preflight.outputs.assembly_version }}
          -p:FileVersion=${{ needs.preflight.outputs.assembly_version }}
          -p:InformationalVersion=${{ needs.preflight.outputs.version }}
          --output publish/${{ matrix.rid }}

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "dist/chronodesk-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive }}"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $archive

      - name: Package Unix tarball
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "publish/${{ matrix.rid }}" -czf "dist/chronodesk-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive }}" .

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $archive = "dist/chronodesk-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive }}"
          $fileName = Split-Path $archive -Leaf
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content -Path "$archive.sha256" -NoNewline

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: chronodesk-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [preflight, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: chronodesk-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -Path artifacts -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No release assets were downloaded."
          }

          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME
          ) + $assets + @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--verify-tag",
            "--generate-notes",
            "--title", "ChronoDesk $env:GITHUB_REF_NAME"
          )

          if ("${{ needs.preflight.outputs.prerelease }}" -eq "true") {
            $arguments += "--prerelease"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
