name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL / C#
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore shared desktop graph
        run: dotnet restore src/ChronoDesk.Desktop/ChronoDesk.Desktop.csproj

      - name: Build shared desktop graph
        run: dotnet build src/ChronoDesk.Desktop/ChronoDesk.Desktop.csproj --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
