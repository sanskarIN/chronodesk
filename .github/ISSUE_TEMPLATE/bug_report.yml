name: Bug report
description: Report a reproducible ChronoDesk defect on any supported host.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ChronoDesk. Do not include passwords, tokens, signing material, private files, device identifiers, or sensitive personal data.
  - type: input
    id: version
    attributes:
      label: ChronoDesk version
      placeholder: "Example: 2.6.0.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / host
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS / iPhone
        - iPadOS / iPad
        - Browser / WebAssembly
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: OS / browser / environment version
      placeholder: "Example: Windows 11 24H2, Android 16, iPadOS 20, or Chrome 140 on Linux"
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture / device / browser details
      description: Provide only non-sensitive information needed to identify the runtime.
      placeholder: "Example: win-arm64, Android arm64 emulator, iPhone simulator arm64, browser-wasm"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Change ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs / browser console output
      description: Paste only minimal redacted lines needed to diagnose the issue. Never include signing credentials or private tokens.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, signing material, device identifiers, and sensitive personal data from this report.
          required: true
