name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop / ${{ matrix.os }} / .NET 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Verify version metadata
        shell: pwsh
        run: ./scripts/check-version.ps1

      - name: Restore desktop
        run: dotnet restore src/ChronoDesk.Desktop/ChronoDesk.Desktop.csproj

      - name: Restore tests
        run: dotnet restore tests/ChronoDesk.Tests/ChronoDesk.Tests.csproj

      - name: Verify desktop formatting
        run: dotnet format src/ChronoDesk.Desktop/ChronoDesk.Desktop.csproj --verify-no-changes --no-restore

      - name: Verify test formatting
        run: dotnet format tests/ChronoDesk.Tests/ChronoDesk.Tests.csproj --verify-no-changes --no-restore

      - name: Verify local documentation links
        shell: pwsh
        run: ./scripts/check-markdown-links.ps1

      - name: Build desktop
        run: dotnet build src/ChronoDesk.Desktop/ChronoDesk.Desktop.csproj --configuration Release --no-restore

      - name: Test shared application
        run: dotnet test tests/ChronoDesk.Tests/ChronoDesk.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Check vulnerable desktop packages
        shell: pwsh
        run: |
          $output = dotnet list src/ChronoDesk.Desktop/ChronoDesk.Desktop.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Vulnerable NuGet dependencies were reported."
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser / WebAssembly / .NET 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Restore browser host
        run: dotnet restore src/ChronoDesk.Browser/ChronoDesk.Browser.csproj

      - name: Build browser host
        run: dotnet build src/ChronoDesk.Browser/ChronoDesk.Browser.csproj --configuration Release --no-restore

  android:
    name: Android / .NET 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android host
        run: dotnet restore src/ChronoDesk.Android/ChronoDesk.Android.csproj

      - name: Build Android host
        run: dotnet build src/ChronoDesk.Android/ChronoDesk.Android.csproj --configuration Release --no-restore

  ios:
    name: iOS and iPadOS / .NET 10
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Restore iOS host
        run: dotnet restore src/ChronoDesk.iOS/ChronoDesk.iOS.csproj

      - name: Build iOS simulator host
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            rid="iossimulator-arm64"
          else
            rid="iossimulator-x64"
          fi
          dotnet build src/ChronoDesk.iOS/ChronoDesk.iOS.csproj --configuration Release --no-restore -p:RuntimeIdentifier="$rid"
